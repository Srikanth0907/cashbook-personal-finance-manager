
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#167a52">
    <meta name="description" content="Cashbook - Personal Finance Manager. Your Money. Your Accounts. Your Records.">

    <title>Cashbook - Personal Finance Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #24332c;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-card {
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            background: #ffffff;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .app-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #167a52;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .tagline {
            margin: 0;
            color: #607168;
            font-size: 15px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 28px;
            padding: 9px 15px;
            border-radius: 20px;
            background: #e5f5ec;
            color: #167a52;
            font-size: 13px;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            color: #89958e;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="welcome-card">

        <div class="app-icon">₹</div>

        <h1>Cashbook</h1>

        <p class="tagline">
            Personal Finance Manager
            <br>
            Your Money. Your Accounts. Your Records.
        </p>

        <div class="status">
            Foundation Setup in Progress
        </div>

        <p class="footer">
            Cashbook V1.0
        </p>

    </main>

</body>
</html>
